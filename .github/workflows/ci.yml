name: 🚀 Deploy to cPanel via FTP

on:
  push:
    branches: [ main ] # Your default branch

jobs:
  ftp-deploy:
    name: 📦 Deploy using FTP
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repo
        uses: actions/checkout@v3

#      # Optional: Build your project
#      - name: 📦 Install Dependencies
#        run: npm ci --production
#
#      - name: 🏗️ Build Project (if applicable)
#        run: npm run build # Remove if you don't have a build step

      - name: 📂 Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./ # Root of repo
          server-dir: ${{ secrets.FTP_PATH }} # e.g., /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.idea/**
            **/.env
            **/.env.*
            **/*.log
            **/tests/**
            **/__tests__/**
            **/coverage/**
            **/.vscode/**
            **/.github/**
            **/dist/**
            **/build/**
            **/.next/**
            **/out/**
            **/README.md
            **/.gitignore
            **/.eslintrc*
            **/.prettierrc*
            **/package-lock.json
            **/yarn.lock
            **/tsconfig.json
            **/webpack.config.js