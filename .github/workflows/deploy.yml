name: 🚀 Deploy Polaris (Frontend + Backend)

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: 📦 Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repo
        uses: actions/checkout@v4

      # --- 1. Build Backend ---
      - name: 🏗️ Build Backend
        run: |
          cd backend
          npm ci
          npm run build

      # --- 2. Upload Backend to polaris ---
      - name: 📂 Upload Backend
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./backend/dist/
          server-dir: ${{ secrets.BACKEND_PATH }}/
          exclude: |
            **/.git*
            **/node_modules/**
            **/.env
            **/*.log
            **/tests/**
            **/*.ts
            **/tsconfig.json

      # --- 3. Build Frontend ---
      - name: 🏗️ Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # --- 4. Upload Frontend to polaris_root (flattened) ---
      - name: 📂 Upload Frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./frontend/dist/
          server-dir: ${{ secrets.FRONTEND_PATH }}/
          exclude: |
            **/.git*
            **/node_modules/**

      # --- 5. Create and upload restart trigger ---
      - name: 🔄 Trigger Node App Restart
        run: |
          mkdir -p ./temp
          echo "$(date +%s)" > ./temp/restart.txt

      - name: 📤 Upload Restart Trigger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./temp/
          server-dir: ${{ secrets.RESTART_PATH }}/

      # --- 6. Create Release Artifact ---
      - name: 📦 Prepare Release Package
        run: |
          # Create release directory structure
          mkdir -p release-package/backend/public
          
          # Copy built backend files
          cp -r backend/dist/* release-package/backend/
          
          # Copy built frontend files into backend/public
          cp -r frontend/dist/* release-package/backend/public/
          
          # Create zip archive
          cd release-package
          zip -r "../Polaris-${{ github.ref_name }}.zip" .
          cd ..

      # --- 7. Create GitHub Release ---
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: "Polaris-${{ github.ref_name }}.zip"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}