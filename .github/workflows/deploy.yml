name: 🚀 Deploy Polaris (Frontend + Backend)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: 📦 Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repo
        uses: actions/checkout@v3

      # --- Build Frontend First ---
      - name: 🏗️ Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # --- Upload Frontend to polaris_root (flattened) ---
      - name: 📂 Upload Frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./frontend/dist/  # Trailing slash flattens contents
          server-dir: ${{ secrets.FRONTEND_PATH }}
          exclude: |
            **/.git*
            **/node_modules/**

      # --- Upload Backend to polaris ---
      - name: 📂 Upload Backend
        id: backend-upload
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./backend/
          server-dir: ${{ secrets.BACKEND_PATH }}
          exclude: |
            **/.git*
            **/node_modules/**
            **/.env
            **/*.log
            **/tests/**

      # --- Conditional Restart ---
      - name: 🔄 Restart Node App
        if: steps.backend-upload.outputs.changed-files > 0
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./restart-trigger/
          server-dir: ${{ secrets.RESTART_PATH }}