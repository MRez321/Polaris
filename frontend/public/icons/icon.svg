<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB3" />
      <stop offset="30%" stop-color="#CEAE80" />
      <stop offset="70%" stop-color="#A67C38" />
      <stop offset="100%" stop-color="#7A5820" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE6A3" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#CEAE80" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#CEAE80" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Luxury Border Frame -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>
  <rect x="32" y="32" width="448" height="448" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6,6"/>

  <!-- Center Decorative Diamond & Needle Emblem -->
  <g transform="translate(256, 230)" filter="url(#shadow)">
    <!-- Polaris 8-Pointed Star Glow -->
    <path d="M 0 -130 L 22 -35 L 115 0 L 22 35 L 0 130 L -22 35 L -115 0 L -22 -35 Z" fill="url(#goldGrad)" opacity="0.95" />
    <path d="M 0 -90 L 16 -24 L 80 0 L 16 24 L 0 90 L -16 24 L -80 0 L -16 -24 Z" fill="url(#accentGlow)" opacity="0.9" />

    <!-- Secondary diagonal small star spikes -->
    <path d="M 0 -60 L 10 -15 L 55 0 L 10 15 L 0 60 L -10 15 L -55 0 L -10 -15 Z" transform="rotate(45)" fill="url(#goldGrad)" opacity="0.75" />

    <!-- Center Sewing Scissors & Needle Silhouette -->
    <!-- Center Core Gem -->
    <circle cx="0" cy="0" r="14" fill="#141414" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="0" cy="0" r="5" fill="#FFE6A3" />
  </g>

  <!-- Brand Typography -->
  <g text-anchor="middle">
    <text x="256" y="395" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-weight="900" font-size="36" fill="url(#goldGrad)" letter-spacing="1">
      پولاریس استایل
    </text>
    <text x="256" y="435" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-weight="600" font-size="16" fill="#8E8E93" letter-spacing="4">
      POLARIS STYLE WORKSHOP
    </text>
  </g>
</svg>
